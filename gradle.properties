org.gradle.caching = true
# jdk.net.unixdomain.tmpdir: Windows EDR blocks AF_UNIX sockets under %TEMP%
# (WSAEINVAL on connect), which breaks Selector.open() and the Gradle daemon
# handshake. Harmless on Linux CI.
org.gradle.jvmargs = -Xms512M -Xmx2048M -Djdk.net.unixdomain.tmpdir=D:/tmp-jdk
org.gradle.parallel = true
android.useAndroidX = true
kotlin.code.style = official
# Extensions are Java only. Prevents adding the Kotlin stdlib.
kotlin.stdlib.default.dependency = false
version = 2.4.0
